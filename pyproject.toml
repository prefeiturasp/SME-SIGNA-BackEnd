[tool.black]
line-length = 79
target-version = ['py312']
extend-exclude = '''
^/.*migrations/                  # Ignora qualquer pasta migrations
| ^/.*venv/                      # Ignora venv
| ^/.*\.venv/                    # Ignora .venv
| gerar_relatorio_pep\.py        # Ignora o script do relatório
'''

[tool.isort]
profile = "black"
line_length = 79

[tool.flake8]
max-line-length = 79

exclude = [
    "migrations",
    "*/migrations/*",
    "__pycache__",
    "venv",
    ".venv",
]

per-file-ignores = [
    "*/__tests__/*.py:E501",
    "*/tests/*.py:E501",
    "*/tests/**/*.py:E501",
    "*/models/__init__.py:F401",
    "apps/core/management/commands/gerar_relatorio_pep.py:E501",
]

[tool.ruff]
line-length = 79
target-version = "py312"

extend-exclude = [
    "*/migrations/*",
    "venv",
    ".venv",
    "apps/core/management/commands/gerar_relatorio_pep.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "D"]

[tool.ruff.lint.per-file-ignores]
"*/__tests__/*.py" = ["E501", "D"]
"*/tests/*.py" = ["E501", "D"]
"*/tests/**/*.py" = ["E501", "D"]
"*/models/__init__.py" = ["F401"]
"*/__init__.py" = ["D104"]
"*/migrations/*.py" = ["D"]
"config/**/*.py" = ["D100"]
"*/admin.py" = ["D100"]
"*/urls.py" = ["D100"]
"*/apps.py" = ["D100"]
"*/constants/*.py" = ["D100"]
"*/management/commands/*.py" = ["D100"]
"*/serializers/*.py" = ["D106", "D205", "D401"]
"*/api/serializers/*.py" = ["D106", "D205", "D401"]
"*/api/filters/*.py" = ["D106"]
"*/filters/*.py" = ["D106"]
"*/models.py" = ["D106", "D205"]
"*/api/views/*.py" = ["D205"]
"*/views.py" = ["D205"]
"*/services/*.py" = ["D205", "D401"]
"apps/designacao/models/*.py" = ["D106", "D205"]
"apps/unidades/models/*.py" = ["D106", "D205"]
"apps/usuarios/models/*.py" = ["D106", "D205"]
"apps/helpers/*.py" = ["D205", "D100", "D107", "D105"]
"apps/designacao/urls_v2.py" = ["D100"]